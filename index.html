<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="w-[90%] mx-auto bg-lime-200 p-4">

    <!-- RECTÁNGULOS DE ARRIBA -->
    <div class="space-y-2 mb-4">
        <div class="h-12 border-4 border-indigo-400"></div>
        <div class="h-12 border-4 border-indigo-400"></div>
        <div class="h-12 border-4 border-indigo-400"></div>
    </div>


    <!-- CUADRO PRINCIPAL -->
    <div class="border-4 border-red-400 p-8">

        <!-- CÍRCULOS -->
        <div class="flex justify-around text-center mb-10">

            <div>
                <p class="mb-2 text-xl">blur</p>
                <div>
                 <img src="imags/feo 2.jpg" alt=""class="w-24 h-24 rounded-full blur-sm object-cover">
                </div>
            </div>

            <div>
                <p class="mb-2 text-xl">transparente</p>
                <div class="w-24 h-24  rounded-full opacity-50">
                    <img src="imags/descarga.jpg" alt="" class="rounded-full">
                </div>
            </div>

            <div>
                <p class="mb-2 text-xl">escala de gris</p>
                <div class="w-24 h-24  rounded-full grayscale">
                    <img src="imags/descarga.jpg" alt="" class="rounded-full">
                </div>
            </div>

        </div>


        <!-- CUADRADOS -->
        <div class="flex justify-around text-center">

            <div>
                <p class="mb-2 text-xl">intensidad</p>
                <div class="brightness-150">
                    <img src="imags/descarga.jpg" alt="">
                </div>
            </div>

            <div>
                <p class="mb-2 text-xl">opacidad</p>
                <div class="opacity-50">
                    <img src="imags/descarga.jpg" alt="">
                </div>
            </div>

            <div>
                <p class="mb-2 text-xl">libre</p>
                <div class="hue-rotate-90">
                    <img src="imags/descarga.jpg" alt="">
                </div>
            </div>

        </div>

    </div>


    <!-- PIE -->
    <div class="border-4 border-green-400 mt-3 p-2 text-center">
        <p class="text-xl">
            diseñado por: John Javier Añaguaya Cutili
        </p>
    </div>

</div>
</body>
</html>
